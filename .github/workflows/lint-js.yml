name: Lint JS

on:
  push:
    paths:
      - "_javascript/**/*.js"
      - ".github/workflows/scripts/**/*.js"
      - "*.js"
  pull_request:
    paths:
      - "_javascript/**/*.js"
      - ".github/workflows/scripts/**/*.js"
      - "*.js"

permissions:
  contents: read

jobs:
  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Dependencies
        run: npm install

      - name: Lint JS
        run: npm run lint:js
